<!DOCTYPE html><html><head><meta charset="utf-8"><title>Splitbaby e2e</title>
<style>html,body{margin:0;background:#111;color:#ddd;font:13px monospace}iframe{width:390px;height:1200px;border:0;position:fixed;left:-9999px}</style>
</head><body><pre id="out">This harness WIPES the demo ledger on this device.
Open it with  ?run=1  to proceed.</pre>
<script type="module">
/* Guarded: it clears splitbaby.demo.v1, which in demo mode is the
   real ledger. Live mode is untouched, but an accidental click
   should still not cost anyone their expenses. */
if (new URLSearchParams(location.search).get("run") !== "1") {
  throw new Error("e2e not armed");
}
const log = [];
const ok = (c, m) => log.push((c ? "PASS  " : "FAIL  ") + m);
const sleep = ms => new Promise(r => setTimeout(r, ms));

function store() { return JSON.parse(localStorage.getItem("splitbaby.demo.v1") || "{}"); }
function setType(el, v) {
  const proto = el instanceof HTMLTextAreaElement ? HTMLTextAreaElement : HTMLInputElement;
  Object.getOwnPropertyDescriptor(proto.prototype, "value").set.call(el, v);
  el.dispatchEvent(new Event("input", { bubbles: true }));
}

// start from a clean demo ledger
localStorage.setItem("splitbaby.demo.v1", JSON.stringify({ expenses:{}, people:{}, presets:{} }));
localStorage.setItem("splitbaby.pref.b002", JSON.stringify({ me:"dutta", graphMode:"owes", debtScope:"all", month:null, catMemory:{} }));

const f = document.createElement("iframe");
f.src = "/b002splitbaby/?demo=1#/add?as=dutta";
document.body.appendChild(f);
await new Promise(r => f.onload = r);
await sleep(1200);

const D = () => f.contentDocument;

// ---------- 1. add an expense through the real form ----------
const amt = D().querySelector(".sb-amount input");
const title = D().querySelector('.sb-field input[type="text"]');
ok(!!amt && !!title, "add form renders its amount and title fields");

const toggles = [...D().querySelectorAll(".sb-toggle")];
const onCount = toggles.filter(t => t.getAttribute("aria-pressed") === "true").length;
ok(onCount === 4, "all four B002 members start selected (got " + onCount + ")");

setType(amt, "1000");
setType(title, "Test groceries");
await sleep(150);

const saveBtn = D().querySelector(".sb-savebar .primary");
ok(saveBtn && !saveBtn.disabled, "save enables once amount and title are valid");
saveBtn.click();
await sleep(900);

let s = store();
let ids = Object.keys(s.expenses);
ok(ids.length === 1, "one expense was written (got " + ids.length + ")");
const e = s.expenses[ids[0]];
ok(e && e.amountPaise === 100000, "amount stored as integer paise: " + (e && e.amountPaise));
const sum = Object.values(e.splits).reduce((a, b) => a + b, 0);
ok(sum === 100000, "splits sum exactly to the total (" + sum + ")");
ok(Object.keys(e.splits).length === 4, "split four ways");
ok(e.splits.dutta === 25000, "equal split is 250.00 each");

// ---------- 2. unselecting a person re-splits ----------
f.contentWindow.location.hash = "#/add?as=dutta";
await sleep(700);
const t2 = [...D().querySelectorAll(".sb-toggle")];
t2.find(t => t.textContent.includes("Zaid")).click();
await sleep(200);
setType(D().querySelector(".sb-amount input"), "999");
setType(D().querySelector('.sb-field input[type="text"]'), "Three way");
await sleep(150);
D().querySelector(".sb-savebar .primary").click();
await sleep(900);

s = store();
const e2 = Object.values(s.expenses).find(x => x.title === "Three way");
ok(!!e2, "second expense saved after unselecting someone");
ok(e2 && Object.keys(e2.splits).length === 3, "now split three ways");
ok(e2 && Object.values(e2.splits).reduce((a,b)=>a+b,0) === 99900, "odd amount still sums exactly");
ok(e2 && e2.splits.dutta === 33300, "payer absorbs the remainder paise");

// ---------- 3. duplicate guard ----------
f.contentWindow.location.hash = "#/add?as=dutta";
await sleep(700);
setType(D().querySelector(".sb-amount input"), "1000");
setType(D().querySelector('.sb-field input[type="text"]'), "Test groceries");
await sleep(400);
ok(/already added/i.test(D().body.textContent), "duplicate guard warns about the repeat");

// ---------- 4. home: balances, graph, debt rows ----------
f.contentWindow.location.hash = "#/";
await sleep(900);
const txt = () => D().body.textContent;
ok(/owed to you/.test(txt()), "hero states that Dutta is owed");
ok(D().querySelectorAll(".sb-debt").length > 0, "simplified debt rows render");
ok(D().querySelectorAll(".sb-graph .g-node").length >= 4, "graph draws a node per member");
ok(D().querySelectorAll(".sb-graph .g-edge").length > 0, "graph draws edges");

// ---------- 5. cover a guest's debt ----------
f.contentWindow.location.hash = "#/add?as=dutta";
await sleep(700);
const gt = [...D().querySelectorAll(".sb-toggle")].find(t => t.textContent.includes("Jap"));
ok(!!gt, "the guest Jap is offered as a toggle");
gt.click();
await sleep(150);
setType(D().querySelector(".sb-amount input"), "500");
setType(D().querySelector('.sb-field input[type="text"]'), "With a guest");
await sleep(150);
D().querySelector(".sb-savebar .primary").click();
await sleep(900);

f.contentWindow.location.hash = "#/";
await sleep(900);
const coverBtn = [...D().querySelectorAll(".sb-debt button")].find(b => b.textContent.trim() === "Cover");
ok(!!coverBtn, "a guest debt offers Cover");
coverBtn.click();
await sleep(400);
const doCover = [...D().querySelectorAll(".sb-sheet button")].find(b => b.textContent.trim() === "Cover it");
ok(!!doCover, "cover sheet opens with a member chooser");
doCover.click();
await sleep(900);

s = store();
const cov = Object.values(s.expenses).find(x => x.coverFor === "jap");
ok(!!cov, "cover recorded as a settlement flagged coverFor=jap");
ok(cov && cov.paidBy === "jap", "cover is booked from the debtor...");
ok(cov && Object.keys(cov.splits)[0] === "dutta", "...to the covering flatmate");

// ---------- 6. the ledger still balances ----------
const { netBalances } = await import("/splitbaby/ledger.js");
const rows = Object.entries(s.expenses).map(([id, d]) => ({ id, ...d }));
const bal = netBalances(rows);
const total = Object.values(bal).reduce((a, b) => a + b, 0);
ok(total === 0, "every balance still sums to exactly zero (got " + total + ")");
ok(Math.round(bal.jap || 0) === 0, "the covered guest is square");

// ---------- 7. soft delete keeps history ----------
const first = Object.keys(s.expenses)[0];
f.contentWindow.location.hash = "#/all";
await sleep(800);
const row = D().querySelector(".sb-exp");
row.click();
await sleep(300);
const del = [...D().querySelectorAll(".sb-exp-detail button")].find(b => b.textContent.trim() === "Delete");
ok(!!del, "an expense can be deleted from its detail");
del.click();
await sleep(900);
s = store();
const anyDeleted = Object.values(s.expenses).some(x => x.deleted === true);
ok(anyDeleted, "delete is a soft flag, the document survives");
ok(Object.values(s.expenses).every(x => Array.isArray(x.history) && x.history.length), "history is recorded on every expense");

const fails = log.filter(l => l.startsWith("FAIL")).length;
document.getElementById("out").textContent =
  "E2E\n" + log.join("\n") + "\n\n" + (log.length - fails) + "/" + log.length + " passed\nENDE2E";
</script></body></html>
